name: One-time Electron security lockfile refresh
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/lockfile-refresh-once.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'eltawalbeh/nova-island'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh exactly the Electron security release and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --save-dev --save-exact electron@44.10.1
      - name: Verify resolved dependency tree
        run: npm ci --no-audit
      - name: Validate tests and high-severity npm audit
        shell: pwsh
        run: |
          npm run check:syntax
          if ($LASTEXITCODE -ne 0) { throw "Syntax checks failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw "High severity vulnerabilities remain" }
      - name: Commit only package and lockfile changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Security: pin Electron 44.10.1 and regenerate npm lockfile"
            if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
            git push origin HEAD:develop
            if ($LASTEXITCODE -ne 0) { throw "Push failed" }
          } else {
            Write-Output "Dependencies already up to date"
          }
